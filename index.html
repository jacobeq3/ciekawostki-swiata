<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Ciekawostki, fakty i interesujące informacje z całego świata.">
<title>Ciekawostki Świata</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f4f6f8;
    color: #17202a;
    line-height: 1.6;
}

header {
    background: linear-gradient(135deg, #111827, #2563eb);
    color: white;
    padding: 22px 5%;
}

.nav {
    max-width: 1200px;
    margin: auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
}

.logo {
    font-size: 25px;
    font-weight: 800;
}

nav a {
    color: white;
    text-decoration: none;
    margin-left: 20px;
    font-weight: 600;
}

.hero {
    max-width: 1200px;
    margin: 35px auto;
    padding: 55px 30px;
    background: white;
    border-radius: 20px;
    text-align: center;
    box-shadow: 0 8px 30px rgba(0,0,0,.07);
}

.hero h1 {
    font-size: clamp(32px, 6vw, 58px);
    margin-bottom: 15px;
}

.hero p {
    color: #64748b;
    max-width: 650px;
    margin: auto;
    font-size: 18px;
}

.search {
    max-width: 650px;
    margin: 25px auto 0;
    display: flex;
}

.search input {
    flex: 1;
    padding: 15px;
    border: 1px solid #d1d5db;
    border-radius: 10px 0 0 10px;
    font-size: 16px;
}

.search button {
    padding: 15px 22px;
    border: none;
    background: #2563eb;
    color: white;
    border-radius: 0 10px 10px 0;
    cursor: pointer;
    font-weight: bold;
}

.container {
    max-width: 1200px;
    margin: 30px auto;
    padding: 0 20px;
}

.ad {
    min-height: 100px;
    border: 2px dashed #cbd5e1;
    background: #e8edf3;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #64748b;
    margin: 25px 0;
    text-align: center;
}

.ad small {
    display: block;
}

.categories {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 25px;
}

.category {
    border: none;
    padding: 10px 17px;
    border-radius: 999px;
    background: #e2e8f0;
    cursor: pointer;
    font-weight: 600;
}

.category:hover,
.category.active {
    background: #2563eb;
    color: white;
}

.layout {
    display: grid;
    grid-template-columns: 2fr 1fr;
    gap: 25px;
}

.articles {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 20px;
}

    border-radius: 16px;
